name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v2.0-beta

permissions:
  id-token: write # Required for NuGet Trusted Publishing
  contents: read  # Required to checkout code

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.LIBDB_TEST_SQL_PASSWORD }}
        ports:
          - 1433:1433
    env:
      DOTNET_NOLOGO: true
      LIBDB_TEST_SQL_PASSWORD: ${{ secrets.LIBDB_TEST_SQL_PASSWORD }}
      LIBDB_BENCHMARK_CONNECTION: Server=127.0.0.1;Database=LIBDB_BENCH_TEST;User ID=SA;Password=${{ secrets.LIBDB_TEST_SQL_PASSWORD }};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True;

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify required secrets
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "${LIBDB_TEST_SQL_PASSWORD}" ]]; then
          echo "ERROR: LIBDB_TEST_SQL_PASSWORD secret is required for release verification." >&2
          exit 1
        fi
        if [[ -z "${NUGET_API_KEY}" ]]; then
          echo "ERROR: NUGET_API_KEY secret is required for package publishing." >&2
          exit 1
        fi

    - name: Wait for SQL Server
      shell: bash
      run: |
        set -euo pipefail
        container_id="$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}' | head -n 1)"
        if [[ -z "$container_id" ]]; then
          echo "ERROR: SQL Server service container was not found." >&2
          docker ps
          exit 1
        fi

        sqlcmd_path="$(docker exec "$container_id" bash -lc 'if [[ -x /opt/mssql-tools18/bin/sqlcmd ]]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [[ -x /opt/mssql-tools/bin/sqlcmd ]]; then echo /opt/mssql-tools/bin/sqlcmd; else exit 2; fi')"
        for attempt in {1..60}; do
          if docker exec -e SQLCMDPASSWORD="$LIBDB_TEST_SQL_PASSWORD" "$container_id" "$sqlcmd_path" -S localhost -U sa -C -Q "SELECT 1" >/dev/null 2>&1; then
            echo "SQL Server is ready."
            exit 0
          fi
          sleep 2
        done

        echo "ERROR: SQL Server did not become ready in time." >&2
        docker logs "$container_id" --tail 80
        exit 1

    # 1) 태그에서 버전 추출 (v 접두 제거)
    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        set -euo pipefail
        ref="${GITHUB_REF#refs/tags/}"
        ver="${ref#v}"
        if [[ -z "$ver" ]]; then
          echo "ERROR: Empty version from tag: $ref" >&2
          exit 1
        fi
        if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.-]+)?$ ]]; then
          echo "ERROR: Tag '$ref' is not a valid SemVer for NuGet. Example: v1.2.3 or v1.2.3-rc.1" >&2
          exit 1
        fi
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        echo "Resolved package version: $ver"

    - name: Restore dependencies
      run: dotnet restore Lib.Db.slnx

    - name: Restore local tools
      run: dotnet tool restore

    - name: Run v2.4.0 release gate
      shell: pwsh
      run: pwsh -NoProfile -File ./Verification/scripts/Invoke-Verification.ps1 -BenchmarkJob Short

    - name: Upload verification artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-artifacts-${{ github.run_id }}
        path: Verification/artifacts/**
        if-no-files-found: warn
        retention-days: 7

    # 2) Pack 시 태그 버전을 강제 주입
    - name: Pack (tag version)
      run: |
        dotnet pack Lib.Db/Lib.Db.csproj \
          --configuration Release \
          --no-restore \
          --output ./nupkgs \
          -p:PackageVersion=${{ steps.version.outputs.version }} \
          -p:Version=${{ steps.version.outputs.version }}

    - name: Push to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
