name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v2.0.0-beta

permissions:
  contents: read  # Required to checkout code

jobs:
  build-and-publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: LibDb_CI_${{ github.run_id }}_${{ github.run_attempt }}!aA1
        ports:
          - 1433:1433
    env:
      DOTNET_NOLOGO: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Enforce main tag release
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
          echo "ERROR: NuGet publish workflow must be triggered by a tag ref." >&2
          exit 1
        fi
        if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.-]+)?$ ]]; then
          echo "ERROR: NuGet publish tag '${GITHUB_REF_NAME}' is not a supported v-prefixed SemVer tag." >&2
          exit 1
        fi

        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        tag_target="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
        if ! git merge-base --is-ancestor "${tag_target}" origin/main; then
          echo "ERROR: NuGet publish is allowed only for tags whose target commit is contained in origin/main." >&2
          echo "Tag: ${GITHUB_REF_NAME}" >&2
          echo "Tag target: ${tag_target}" >&2
          exit 1
        fi

        echo "NuGet release tag ${GITHUB_REF_NAME} is on origin/main."

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Verify required secrets
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "${NUGET_API_KEY}" ]]; then
          echo "ERROR: NUGET_API_KEY secret is required for NuGet publishing." >&2
          exit 1
        fi

    - name: Wait for SQL Server
      shell: bash
      env:
        LIBDB_TEST_SQL_PASSWORD: LibDb_CI_${{ github.run_id }}_${{ github.run_attempt }}!aA1
      run: |
        set -euo pipefail
        container_id="$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}' | head -n 1)"
        if [[ -z "$container_id" ]]; then
          echo "ERROR: SQL Server service container was not found." >&2
          docker ps
          exit 1
        fi

        sqlcmd_path="$(docker exec "$container_id" bash -lc 'if [[ -x /opt/mssql-tools18/bin/sqlcmd ]]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [[ -x /opt/mssql-tools/bin/sqlcmd ]]; then echo /opt/mssql-tools/bin/sqlcmd; else exit 2; fi')"
        for attempt in {1..60}; do
          if docker exec -e SQLCMDPASSWORD="$LIBDB_TEST_SQL_PASSWORD" "$container_id" "$sqlcmd_path" -S localhost -U sa -C -Q "SELECT 1" >/dev/null 2>&1; then
            echo "SQL Server is ready."
            exit 0
          fi
          sleep 2
        done

        echo "ERROR: SQL Server did not become ready in time." >&2
        docker logs "$container_id" --tail 80
        exit 1

    # 1) 태그에서 버전 추출 (v 접두 제거)
    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        set -euo pipefail
        ref="${GITHUB_REF#refs/tags/}"
        ver="${ref#v}"
        if [[ -z "$ver" ]]; then
          echo "ERROR: Empty version from tag: $ref" >&2
          exit 1
        fi
        if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.-]+)?$ ]]; then
          echo "ERROR: Tag '$ref' is not a valid SemVer for NuGet. Example: v1.2.3 or v1.2.3-rc.1" >&2
          exit 1
        fi
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        echo "Resolved package version: $ver"

    - name: Restore dependencies
      run: dotnet restore Lib.Db.slnx

    - name: Restore local tools
      run: dotnet tool restore

    - name: Run release verification gate
      shell: pwsh
      env:
        LIBDB_TEST_SQL_PASSWORD: LibDb_CI_${{ github.run_id }}_${{ github.run_attempt }}!aA1
      run: |
        $env:LIBDB_BENCHMARK_CONNECTION = "Server=127.0.0.1;Database=LIBDB_BENCH_TEST;User ID=SA;Password=$env:LIBDB_TEST_SQL_PASSWORD;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True;"
        pwsh -NoProfile -File ./Verification/scripts/Invoke-Verification.ps1 -BenchmarkJob Short

    - name: Build allowlisted release package
      shell: pwsh
      run: pwsh -NoProfile -File ./Verification/scripts/Invoke-ReleasePackage.ps1 -ArtifactsDirectory Verification/artifacts/release-package -PackageVersion '${{ steps.version.outputs.version }}'

    - name: Upload verification artifacts
      uses: actions/upload-artifact@v6
      with:
        name: verification-artifacts-${{ github.run_id }}
        path: |
          Verification/artifacts/**
          !Verification/artifacts/release-package/**
          !Verification/artifacts/**/*.nupkg
          !Verification/artifacts/**/*.snupkg
        if-no-files-found: warn
        retention-days: 7

    - name: Push to NuGet
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        package_path="./Verification/artifacts/release-package/Lib.Db.${{ steps.version.outputs.version }}.nupkg"
        if [[ ! -f "$package_path" ]]; then
          echo "ERROR: Allowlisted release package was not found: $package_path" >&2
          exit 1
        fi
        dotnet nuget push "$package_path" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
